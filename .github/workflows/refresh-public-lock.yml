name: One-time public lockfile security repair
on:
  push:
    branches: [fix/public-dependency-audit-20261105]
    paths:
      - .github/workflows/refresh-public-lock.yml
permissions:
  contents: write
jobs:
  repair-lock:
    if: github.repository == 'executiveusa/CLONELY-FANZ'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair only semver-compatible registry advisories
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run typecheck
          npm run build
          npm run audit:landing
      - name: Commit verified dependency changes to the same isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): resolve audited Vite and source-map-js advisories'
            git push origin HEAD:fix/public-dependency-audit-20261105
          fi
